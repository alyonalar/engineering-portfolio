name: Postman API checks

on:
  push:
    paths:
      - "qa/api-testing/**"
      - ".github/workflows/postman.yml"
  pull_request:
    paths:
      - "qa/api-testing/**"
      - ".github/workflows/postman.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newman:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Postman collection
        run: npx --yes newman@6.2.1 run qa/api-testing/postman_collection.json
